# Copies the deployed T Notepad build (tnotepad/) to the TKosa/tnotepad.com
# repo, which GitHub Pages serves at https://tnotepad.com. Runs whenever a
# push changes tnotepad/, which is what `npm run deploy` in tnotepad-svelte does.
# Needs the secret TNOTEPAD_COM_DEPLOY_KEY: the private half of a deploy key
# with write access on TKosa/tnotepad.com (Settings > Deploy keys there).
name: Sync T Notepad to tnotepad.com

on:
  push:
    branches: [master]
    paths: ['tnotepad/**']
  workflow_dispatch:

concurrency:
  group: sync-tnotepad
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this site
        uses: actions/checkout@v5
        with:
          path: source

      # Loaded by hand rather than through actions/checkout, rebuilding the line
      # breaks, so a key pasted with Windows line endings, spaces or no line
      # breaks at all still works.
      - name: Load the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.TNOTEPAD_COM_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          body=$(printf '%s' "$DEPLOY_KEY" | tr -d ' \t\r\n' | sed -e 's/-----BEGINOPENSSHPRIVATEKEY-----//' -e 's/-----ENDOPENSSHPRIVATEKEY-----//')
          {
            echo '-----BEGIN OPENSSH PRIVATE KEY-----'
            printf '%s\n' "$body" | fold -w 70
            echo '-----END OPENSSH PRIVATE KEY-----'
          } > ~/.ssh/tnotepad_com
          chmod 600 ~/.ssh/tnotepad_com
          if ! ssh-keygen -y -f ~/.ssh/tnotepad_com > /dev/null; then
            echo "::error::TNOTEPAD_COM_DEPLOY_KEY is not a valid private key. Paste the whole private key file (it starts with -----BEGIN OPENSSH PRIVATE KEY-----)."
            exit 1
          fi
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2> /dev/null

      - name: Check out tnotepad.com
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/tnotepad_com -o IdentitiesOnly=yes
        run: git clone --depth 1 git@github.com:TKosa/tnotepad.com.git site

      - name: Replace the site with the current build
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
          cp -r source/tnotepad/. site/
          echo tnotepad.com > site/CNAME
          touch site/.nojekyll

      - name: Commit and push
        working-directory: site
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/tnotepad_com -o IdentitiesOnly=yes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "tnotepad.com is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from TKosa.github.io ${GITHUB_SHA::7}"
          git push
